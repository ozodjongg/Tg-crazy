# Lokal ishlab chiqish uchun Postgres: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tgcrazy
      POSTGRES_PASSWORD: tgcrazy
      POSTGRES_DB: tgcrazy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
